<main class="min-h-screen grid lg:grid-cols-2 bg-white">

  <!-- Left Column: Branding / Marketing -->
  <div class="hidden lg:flex flex-col justify-between bg-[#01052d] p-16 text-white relative overflow-hidden">
    <div class="absolute inset-0 dogo-pattern opacity-[0.03] pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-[600px] h-[600px] rounded-full blur-[150px] opacity-20"
      style="background: radial-gradient(circle, #4361EE, transparent)"></div>
    <div class="absolute -top-40 -right-40 w-[600px] h-[600px] rounded-full blur-[150px] opacity-10"
      style="background: radial-gradient(circle, #023E8A, transparent)"></div>

    <!-- Centralized Logo -->
    <div class="relative z-10 flex items-center space-x-3">
      <img src="/brand/D LOGO W.png" alt="Dogo" class="h-8 object-contain">
      <span class="text-xl font-bold tracking-tight text-white uppercase italic">DOGO Finance</span>
    </div>

    <div class="relative z-10 w-full max-w-lg mb-20">
      <h1 class="text-4xl lg:text-5xl font-black leading-[1.1] mb-5 tracking-tight">
        {{ sidebarTitle }} <span class="text-[#4361EE]">{{ sidebarHighlight }}</span>
      </h1>
      <p class="text-sm text-slate-400 font-medium leading-relaxed mb-8">
        {{ sidebarSubtext }}
      </p>

      <!-- Sidebar Dynamic Slot -->
      <ng-content select="[sidebarContent]"></ng-content>

      <!-- Fallback Security Notice if no custom content provided -->
      <div *ngIf="sidebarNoticeTitle" class="bg-white/[0.03] border border-white/10 p-5 rounded-2xl backdrop-blur-sm">
        <div class="flex items-center space-x-3.5">
          <div class="w-9 h-9 bg-[#4361EE]/10 rounded-full flex items-center justify-center border border-[#4361EE]/20">
            <i [class]="sidebarNoticeIcon" class="text-[#4361EE] text-lg"></i>
          </div>
          <div>
            <p class="font-bold text-white text-xs">{{ sidebarNoticeTitle }}</p>
            <p class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider mt-0.5">{{ sidebarNoticeBody }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Small footer text -->
    <div class="relative z-10 text-[10px] font-semibold uppercase tracking-wider text-slate-500">
      &copy; 2026 DOGO Finance Ltd. All rights reserved.
    </div>
  </div>

  <!-- Right Column: Form Content -->
  <div class="flex flex-col justify-center px-6 py-12 lg:px-20 xl:px-28 relative bg-[#FAFBFF]">

    <!-- Mobile Header (Visible only on small screens) -->
    <div class="lg:hidden flex items-center space-x-3 mb-10 justify-center">
      <img src="/brand/D LOGO W.png" alt="Dogo" class="h-8 object-contain">
      <span class="text-xl font-bold tracking-tight text-[#030E65] uppercase italic">DOGO Finance</span>
    </div>

    <div class="w-full max-w-2xl mx-auto bg-white border border-[#E8ECF5] rounded-3xl p-8 md:p-10 shadow-sm">

      <a [routerLink]="backLink"
        class="inline-flex items-center gap-1 text-slate-400 hover:text-[#030E65] font-bold mb-8 transition-colors text-[11px] uppercase tracking-wider">
        <i class="ri-arrow-left-line"></i>
        <span>{{ backText }}</span>
      </a>

      <div class="mb-8">
        <h2 class="text-2xl md:text-3xl font-black text-[#030E65] mb-2 tracking-tight">{{ pageTitle }}</h2>
        <p class="text-slate-500 text-xs md:text-sm font-medium">{{ pageSubtext }}</p>
      </div>

      <!-- Main Content Slot -->
      <ng-content></ng-content>

    </div>
  </div>
</main>
