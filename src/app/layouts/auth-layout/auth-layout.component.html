<main class="min-h-screen grid lg:grid-cols-2 bg-[var(--dogo-cream)]">
  
  <!-- Left Column: Branding / Marketing -->
  <div class="hidden lg:flex flex-col justify-between bg-[var(--dogo-dark)] p-16 text-white relative overflow-hidden">
    <div class="absolute inset-0 dogo-pattern opacity-[0.05] pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-[600px] h-[600px] rounded-full blur-[150px] opacity-10" style="background: radial-gradient(circle, var(--dogo-secondary), transparent)"></div>

    <!-- Centralized Logo -->
    <div class="relative z-10 flex items-center space-x-3">
      <img src="/brand/icon.png" alt="Dogo" class="w-10 h-10 object-contain">
      <span class="text-2xl font-black tracking-tight text-white uppercase italic">DOGO Finance</span>
    </div>

    <div class="relative z-10 w-full max-w-lg mb-20 animate-fade-in">
      <h1 class="text-5xl lg:text-6xl font-black leading-[1.1] mb-6 tracking-tighter">
        {{ sidebarTitle }} <span class="text-[var(--dogo-secondary)]">{{ sidebarHighlight }}</span>
      </h1>
      <p class="text-lg text-white/70 font-medium leading-relaxed mb-12">
        {{ sidebarSubtext }}
      </p>

      <!-- Sidebar Dynamic Slot -->
      <ng-content select="[sidebarContent]"></ng-content>
      
      <!-- Fallback Security Notice if no custom content provided -->
      <div *ngIf="sidebarNoticeTitle" class="bg-white/5 border border-white/10 p-6 rounded-[24px]">
        <div class="flex items-center space-x-4 mb-3">
           <div class="w-10 h-10 bg-[var(--dogo-primary)] rounded-full flex items-center justify-center">
             <i [class]="sidebarNoticeIcon" class="text-[var(--dogo-secondary)] text-xl"></i>
           </div>
           <div>
              <p class="font-black text-white text-sm">{{ sidebarNoticeTitle }}</p>
              <p class="text-xs text-white/50 font-bold uppercase tracking-widest mt-1">{{ sidebarNoticeBody }}</p>
           </div>
        </div>
      </div>
    </div>

    <!-- Small footer text -->
    <div class="relative z-10 text-xs font-bold uppercase tracking-widest text-[var(--dogo-secondary)]/50">
      &copy; 2026 DOGO Finance Ltd.
    </div>
  </div>

  <!-- Right Column: Form Content -->
  <div class="flex flex-col justify-center px-6 py-12 lg:px-24 xl:px-32 relative">
    
    <!-- Mobile Header (Visible only on small screens) -->
    <div class="lg:hidden flex items-center space-x-3 mb-12 justify-center">
      <img src="/brand/icon.png" alt="Dogo" class="w-8 h-8 object-contain">
      <span class="text-2xl font-black tracking-tight text-[var(--dogo-primary)] uppercase italic">DOGO Finance</span>
    </div>

    <div class="w-full max-w-lg mx-auto">
      <a [routerLink]="backLink" class="inline-flex items-center space-x-2 text-[var(--dogo-muted)] hover:text-[var(--dogo-primary)] font-black mb-10 transition-colors text-sm uppercase tracking-widest">
        <i class="ri-arrow-left-line"></i>
        <span>{{ backText }}</span>
      </a>

      <div class="mb-10">
        <h2 class="text-3xl md:text-4xl font-black text-[var(--dogo-dark)] mb-3 tracking-tighter">{{ pageTitle }}</h2>
        <p class="text-[var(--dogo-muted)] font-medium">{{ pageSubtext }}</p>
      </div>

      <!-- Main Content Slot -->
      <ng-content></ng-content>

    </div>
  </div>
</main>
